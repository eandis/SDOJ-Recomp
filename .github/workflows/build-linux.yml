name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache wget \
            libgtk-3-dev libx11-xcb-dev libvulkan-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libcurl4-openssl-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          ccache --set-config=max_size=5G
          cmake --preset linux-amd64-release \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset linux-amd64-release --parallel 3

      - name: Package
        run: |
          out=out/build/linux-amd64-release
          mkdir -p package/sdoj-recomp-linux-amd64
          cp -L "$out/DoDonPachi SaiDaiOuJou" $out/*.so package/sdoj-recomp-linux-amd64/
          cp -r $out/tools package/sdoj-recomp-linux-amd64/
          curl -sSfL -o package/sdoj-recomp-linux-amd64/gamecontrollerdb.txt \
            https://raw.githubusercontent.com/mdqinc/SDL_GameControllerDB/master/gamecontrollerdb.txt
          tar -C package -czf sdoj-recomp-linux-amd64.tar.gz sdoj-recomp-linux-amd64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sdoj-recomp-linux-amd64
          path: sdoj-recomp-linux-amd64.tar.gz
          if-no-files-found: error
